name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      # One platform failing says nothing about the others; see them all.
      fail-fast: false
      matrix:
        include:
          # The frontend is the same everywhere, so it is linted and tested on
          # macOS only.
          - os: macos-latest
            frontend: true
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # WebKitGTK for the webview, libxdo for the menu's stock items, OpenSSL
      # for libgit2's https transport.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `tsc && vite build`: type-checks, and produces the `dist` that
      # `tauri::generate_context!` needs to exist at compile time.
      - run: npm run build
      - run: npm run lint
        if: matrix.frontend
      - run: npm test
        if: matrix.frontend

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  # The AppImage and .deb, for trying a build on a real Linux desktop until
  # releases carry them. Not after every PR push: a release build is slow, and
  # the check above already says whether it compiles.
  bundle-linux:
    needs: check
    if: github.event_name != 'pull_request'
    # The oldest supported Ubuntu: an AppImage runs on glibc as new as the one
    # it was built against, and no older.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # As for the check, plus patchelf for the AppImage's library paths.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The updater key lives only where releases are cut, and these are not
      # updates; without it the updater artifacts would fail the build.
      - run: npx tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          # linuxdeploy is itself an AppImage, and the runner has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: aditor-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # The NSIS installer, for trying a build on a real Windows machine until
  # releases carry it. Unsigned, so SmartScreen will ask first.
  bundle-windows:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # As for the Linux bundles: no updater key here, and these are not updates.
      # Bash, so the JSON is quoted as it is there; PowerShell would mangle it.
      - run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: aditor-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
