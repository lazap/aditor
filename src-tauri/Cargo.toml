[package]
name = "aditor"
version = "0.6.1"
description = "A lightweight editor whose main pane is an agent CLI"
authors = ["Lazar Petrov"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/lazap/aditor"
homepage = "https://github.com/lazap/aditor"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps ~/.claude.json's key order across the account-identity
# splice in `accounts.rs`; without it every switch would reorder Claude Code's
# whole config file.
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
base64 = "0.23.1"
ignore = "0.4.33"
notify = "8"
tauri-plugin-dialog = "2"
git2 = "0.21"
# The home directory, which Windows does not reliably put in HOME.
dirs = "7"
# The loopback server's bearer tokens, from the OS's CSPRNG on every platform.
getrandom = "0.3"
# Canonical paths without Windows' `\\?\` prefix; plain canonicalize elsewhere.
dunce = "1"
# The live limits refresh in `agents.rs` -- its only network call.
ureq = { version = "3", features = ["json"] }
# The MCP server in `mcp.rs`: a blocking loopback listener on its own thread.
tiny_http = "0.12"
# Native "agent finished / needs you" notifications, from `status.rs` events.
tauri-plugin-notification = "2"
# Cargo.toml and pyproject.toml, for the run configurations `run.rs` suggests.
toml = "0.8"
# Self-update from the GitHub release's latest.json, and the relaunch after it.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The terminal's Ctrl+Shift+C and Ctrl+Shift+V off macOS, where the webview's
# own clipboard API is not dependable for reading.
tauri-plugin-clipboard-manager = "2"

# `platform.rs`'s halves. Unix: kill(pid, 0) for the agent session registry's
# liveness probe, and killpg to stop a run configuration with everything it
# started. Windows: the same liveness probe through a process handle, and the
# execution state that keeps the computer awake.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
