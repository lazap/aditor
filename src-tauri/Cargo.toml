[package]
name = "aditor"
version = "0.1.0"
description = "A lightweight editor whose main pane is an agent CLI"
authors = ["Lazar"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps ~/.claude.json's key order across the account-identity
# splice in `accounts.rs`; without it every switch would reorder Claude Code's
# whole config file.
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
base64 = "0.23.1"
ignore = "0.4.33"
notify = "8"
tauri-plugin-dialog = "2"
git2 = "0.21"
# Only for kill(pid, 0): the liveness probe behind the agent session registry.
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
